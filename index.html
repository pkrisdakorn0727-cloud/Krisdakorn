<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AR Washing Machine</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
    #ui{
      position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);
      width:min(92vw,430px);padding:12px 14px;border-radius:18px;
      background:rgba(20,20,20,.82);color:white;text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px)
    }
    #speed{font-size:22px;font-weight:700;margin:3px 0 10px}
    button{
      border:0;border-radius:12px;padding:12px 18px;margin:4px;
      font-size:17px;font-weight:700;cursor:pointer;min-width:105px
    }
    #status{font-size:13px;opacity:.8;margin-top:6px}
    .hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;
      color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:12px;font-size:14px}
  </style>
</head>

<body>
  <div class="hint">📷 ส่องกล้องไปที่ Hiro Marker</div>

  <div id="ui">
    <div>ความเร็วถังซัก</div>
    <div id="speed">0 RPM</div>
    <button onclick="changeSpeed(-100)">− 100</button>
    <button onclick="toggleRun()">▶ / ⏸</button>
    <button onclick="changeSpeed(100)">+ 100</button>
    <button onclick="stopMachine()">STOP</button>
    <div id="status">ยังไม่พบ Marker</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled:false;">

    <a-marker id="marker" preset="hiro" emitevents="true">
      <!-- Washing machine body -->
      <a-box position="0 0.9 0" width="1.8" height="1.8" depth="1.25"
             color="#e8edf2" metalness="0.25" roughness="0.35"></a-box>

      <!-- Top panel -->
      <a-box position="0 1.85 0" width="1.82" height="0.22" depth="1.27"
             color="#b9c3cc"></a-box>

      <!-- Control panel -->
      <a-box position="0 1.63 -0.64" width="1.5" height="0.32" depth="0.05"
             color="#20252a"></a-box>
      <a-cylinder position="0.52 1.63 -0.69" radius="0.11" height="0.035"
                   rotation="90 0 0" color="#8fd3ff"></a-cylinder>
      <a-box position="-0.32 1.63 -0.69" width="0.42" height="0.11" depth="0.035"
             color="#66d9b0"></a-box>

      <!-- Door -->
      <a-cylinder id="door" position="0 0.92 -0.66" radius="0.58" height="0.09"
                  rotation="90 0 0" color="#303841" metalness="0.8"></a-cylinder>
      <a-cylinder position="0 0.92 -0.715" radius="0.46" height="0.045"
                  rotation="90 0 0" color="#8ec5e8" opacity="0.78"></a-cylinder>

      <!-- Drum -->
      <a-cylinder id="drum" position="0 0.92 -0.75" radius="0.34" height="0.025"
                   rotation="90 0 0" color="#cbd5dc"></a-cylinder>
      <a-ring position="0 0.92 -0.78" radius-inner="0.22" radius-outer="0.29"
              rotation="90 0 0" color="#687680"></a-ring>

      <!-- Feet -->
      <a-box position="-0.65 0.05 -0.4" width="0.18" height="0.15" depth="0.55" color="#333"></a-box>
      <a-box position="0.65 0.05 -0.4" width="0.18" height="0.15" depth="0.55" color="#333"></a-box>

      <a-text value="WASHER" position="-0.55 1.48 -0.69"
              width="1.0" color="#ffffff"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  let speed = 0;
  let running = false;
  const drum = document.querySelector('#drum');
  const marker = document.querySelector('#marker');
  const speedText = document.querySelector('#speed');
  const statusText = document.querySelector('#status');

  function render(){
    speedText.textContent = speed + " RPM";
    statusText.textContent = running
      ? "กำลังทำงาน • พบ Marker แล้ว"
      : "หยุดอยู่ • พบ Marker แล้ว";
  }

  function changeSpeed(delta){
    speed = Math.max(0, Math.min(1200, speed + delta));
    if(speed > 0) running = true;
    render();
  }

  function toggleRun(){
    if(speed === 0) speed = 600;
    running = !running;
    render();
  }

  function stopMachine(){
    speed = 0;
    running = false;
    render();
  }

  marker.addEventListener('markerFound', () => {
    statusText.textContent = running ? "กำลังทำงาน • พบ Marker แล้ว" : "หยุดอยู่ • พบ Marker แล้ว";
  });
  marker.addEventListener('markerLost', () => {
    statusText.textContent = "ไม่พบ Marker";
  });

  function animate(){
    if(running && speed > 0){
      // RPM -> degrees per frame (approx. 60fps)
      drum.object3D.rotation.z += (speed / 60) * Math.PI / 180;
    }
    requestAnimationFrame(animate);
  }
  render();
  animate();
</script>
</body>
</html>
